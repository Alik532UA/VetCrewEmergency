<!--
	Колір плитки — темно-червоний #66100a: те саме, що токен `color-secondary` у
	темній темі, тобто колір кнопки гарячої лінії на першому екрані. Саме її
	впізнають, і значок у вкладці має бути з нею однієї барви.

	Число, а не токен, і це не недогляд: favicon віддається окремим файлом і жодного
	CSS проєкту не бачить. Тож копія тут неминуча, а поруч із нею назва того, з чого
	вона знята, щоб наступна зміна палітри не лишила вкладку осторонь.

	Одна барва на обидві теми: браузер малює вкладку своїм тлом, а не тлом сайту, і
	`prefers-color-scheme` усередині favicon підтримують не всі. Білу лапу на цьому
	червоному видно й на світлій смузі вкладок, і на темній (12.78:1 із білим).

	УВАГА для наступної правки цього коментаря: це XML, і подвійний дефіс усередині
	коментаря заборонений. Перша редакція написала тут назви токенів із двома
	дефісами попереду — і браузер віддав сторінку з помилкою розбору замість значка,
	мовчки, бо favicon ніде не показує своїх помилок.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<rect width="32" height="32" rx="8" fill="#66100a" />
	<g fill="#ffffff">
		<ellipse cx="9.2" cy="12.6" rx="3" ry="3.9" transform="rotate(-18 9.2 12.6)" />
		<ellipse cx="15.6" cy="9.8" rx="3.1" ry="4.1" />
		<ellipse cx="22" cy="11.6" rx="3" ry="3.9" transform="rotate(16 22 11.6)" />
		<ellipse cx="26.2" cy="18" rx="2.6" ry="3.2" transform="rotate(30 26.2 18)" />
		<path
			d="M15.6 16.4c3.8 0 7 3.1 7 6.5 0 2.7-2.2 4.4-5.2 4.4-1.1 0-1.4-.3-1.8-.3s-.7.3-1.8.3c-3 0-5.2-1.7-5.2-4.4 0-3.4 3.2-6.5 7-6.5Z"
		/>
	</g>
</svg>
